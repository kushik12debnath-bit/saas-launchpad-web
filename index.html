      (function () {
        try {

          if (t === "dark" || t === "light" || t === "emerald") {
            document.documentElement.dataset.theme = t;
          } else {
            document.documentElement.dataset.theme = "emerald";
          }
          var m = document.querySelector('meta[name="theme-color"]');
          var cur = document.documentElement.dataset.theme;
          if (m) {
            if (cur === "light") m.setAttribute("content", "#f6f8fc");
            else if (cur === "emerald") m.setAttribute("content", "#07130e");
            else m.setAttribute("content", "#0a1128");
          }
        } catch (e) {}
      })();
    </script>
